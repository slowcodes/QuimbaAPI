
services:
  webapp:
    image: ezennacharles/quimba-web
    ports:
      - "80:80"
    environment:
      - API_URL=http://app/api/
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - quimba_network
  cache:
    image: redis:7-alpine  # Updated to newer version
    command: redis-server --appendonly yes  # Enable persistence
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - quimba_network
    volumes:
      - redis_data:/data  # Add volume for persistence
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
  app:
    image: ezennacharles/quimba
    ports:
       - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://quimba:secretofthesand@db:5432/postgres
    depends_on:
      - db
      - cache
    restart: unless-stopped
    networks:
      - quimba_network
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: quimba
      POSTGRES_PASSWORD: secretofthesand
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - quimba_network
volumes:
  postgres_data:
  redis_data:
networks:
  quimba_network:  # Shared network for all containers